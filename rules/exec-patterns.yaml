# Remote Execution, LOLBins, Interpreters, Save-and-Run, and Encoded Payload Rules
# All regexes are compiled by Rust's finite-automata DFA engine (guaranteed O(n), ReDoS-immune).

fetch_tools:
  - irm
  - iwr
  - invoke-restmethod
  - invoke-webrequest
  - curl
  - wget

save_tools:
  - curl
  - wget
  - irm
  - iwr
  - invoke-restmethod
  - invoke-webrequest
  - certutil
  - bitsadmin
  - start-bitstransfer
  - downloadfile

