[package]
name = "trendar-engine-cli"
version.workspace = true
edition.workspace = true
description = "Standalone CLI and parallel batch scanner for Trendar security engine"

[[bin]]
name = "trendar-scan"
path = "src/main.rs"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trendar-engine-core = { path = "../engine-core" }
