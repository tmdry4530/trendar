[package]
name = "trendar-engine-core"
version.workspace = true
edition.workspace = true
description = "Pure, zero-I/O static threat detection engine for Trendar"

[dependencies]
aho-corasick = "1"
base64 = "0.22"
hex = "0.4"
pulldown-cmark = { version = "0.12", default-features = false }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
unicode-normalization = "0.1"
url = "2"
