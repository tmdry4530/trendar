[package]
name = "trendar-engine-napi"
version.workspace = true
edition.workspace = true
description = "NAPI-RS Node.js native binding for Trendar security engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trendar-engine-core = { path = "../engine-core" }

[build-dependencies]
napi-build = "2"
